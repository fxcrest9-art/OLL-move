<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINCE ANIME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #141414; 
            color: #ffffff; 
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 15px 4%; 
            background: #000000;
            position: sticky; top: 0;
            z-index: 100;
            flex-wrap: wrap; gap: 10px;
        }

        .logo { 
            color: #E50914; 
            font-size: 24px; 
            font-weight: 900; 
            letter-spacing: 1px;
        }

        .controls { 
            display: flex; 
            gap: 8px; 
            width: 100%; max-width: 600px;
            flex-wrap: wrap;
        }

        .controls input, .controls select { 
            padding: 9px 12px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            background: #1f1f1f; 
            color: #fff; 
            font-size: 13px;
            outline: none;
        }

        .controls input { flex: 2; min-width: 140px; }
        .controls select { flex: 1; min-width: 80px; }

        .controls button { 
            background: #E50914; 
            color: #fff; 
            border: none; 
            padding: 9px 18px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .container { padding: 20px 4%; }
        
        .section-title { 
            font-size: 20px; 
            margin-bottom: 15px; 
            color: #ffffff; 
            font-weight: bold;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); 
            gap: 15px; 
        }

        .card { 
            background: #181818; 
            border-radius: 4px; 
            overflow: hidden; 
            text-align: center; 
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .card:hover { transform: scale(1.04); }

        .card img { width: 100%; height: 200px; object-fit: cover; }
        
        .card-title { 
            font-size: 12px; 
            padding: 8px; 
            font-weight: 500; 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #fff;
        }

        .loading { 
            text-align: center; 
            font-size: 16px; 
            color: #aaa; 
            margin-top: 30px; 
            grid-column: 1 / -1; 
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }

        .modal-content { 
            width: 95%; max-width: 850px; 
            height: 480px; 
            background: #000; 
            position: relative; 
            border-radius: 8px;
            overflow: hidden;
        }

        .close-btn { 
            position: absolute; 
            top: -35px; right: 0; 
            color: #fff; font-size: 28px; 
            cursor: pointer; font-weight: bold; 
        }

        .server-btn-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .server-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">PRINCE ANIME</div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search Anime, Movies, Dubbed...">
            <select id="typeSelect">
                <option value="anime">Anime (HiAnime)</option>
                <option value="movie">Movies (MovieBox)</option>
            </select>
            <select id="langSelect">
                <option value="sub">SUB</option>
                <option value="dub">DUB / Hindi</option>
            </select>
            <button onclick="handleSearch()">Search</button>
        </div>
    </div>

    <div class="container">
        <div class="section-title" id="heading">Trending Now</div>
        <div id="results" class="grid"></div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
        <div class="server-btn-container">
            <button class="server-btn" onclick="switchServer(1)">Server 1 (HiAnime)</button>
            <button class="server-btn" onclick="switchServer(2)">Server 2 (MovieBox)</button>
            <button class="server-btn" onclick="switchServer(3)">Server 3 (AnimeWorld)</button>
        </div>
    </div>

    <script>
        const TMDB_KEY = '8476a7ab80ad76f0936744dfb1d5e676';
        const resultsContainer = document.getElementById('results');
        const heading = document.getElementById('heading');
        const searchInput = document.getElementById('searchInput');

        let currentMedia = { type: 'anime', id: '', title: '' };

        // Auto-load Trending from multiple fallback engines
        async function loadTrending() {
            resultsContainer.innerHTML = '<div class="loading">Fetching latest content...</div>';
            
            // Engine 1: Jikan / Consumet (HiAnime)
            try {
                const res = await fetch('https://api.jikan.moe/v4/top/anime');
                const data = await res.json();
                if (data.data && data.data.length > 0) {
                    renderAnimeCards(data.data);
                    return;
                }
            } catch (e) {}

            // Engine 2: TMDB Fallback (MovieBox Data)
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}`);
                const data = await res.json();
                renderTmdbCards(data.results);
            } catch (e) {
                resultsContainer.innerHTML = '<div class="loading">Failed to load content. Reload page.</div>';
            }
        }

        async function handleSearch() {
            let query = searchInput.value.trim();
            const type = document.getElementById('typeSelect').value;
            const lang = document.getElementById('langSelect').value;

            if (!query) return;

            if (lang === 'dub') {
                query += ' Hindi';
            }

            heading.innerText = `Results for: ${searchInput.value.trim()}`;
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            if (type === 'anime') {
                try {
                    const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    renderAnimeCards(data.data);
                } catch (error) {
                    resultsContainer.innerHTML = '<div class="loading">Search error. Try again.</div>';
                }
            } else {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`);
                    const data = await res.json();
                    renderTmdbCards(data.results);
                } catch (error) {
                    resultsContainer.innerHTML = '<div class="loading">Search error. Try again.</div>';
                }
            }
        }

        function renderAnimeCards(items) {
            resultsContainer.innerHTML = '';
            if (!items || items.length === 0) {
                resultsContainer.innerHTML = '<div class="loading">No content found!</div>';
                return;
            }

            items.forEach(item => {
                const title = item.title;
                const image = item.images.jpg.image_url;
                const id = item.mal_id;

                if (image && title) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${image}" alt="${title}">
                        <div class="card-title">${title}</div>
                    `;
                    card.onclick = () => openPlayer('anime', id, title);
                    resultsContainer.appendChild(card);
                }
            });
        }

        function renderTmdbCards(items) {
            resultsContainer.innerHTML = '';
            if (!items || items.length === 0) {
                resultsContainer.innerHTML = '<div class="loading">No content found!</div>';
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name;
                const posterPath = item.poster_path;

                if (posterPath && title) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w500${posterPath}" alt="${title}">
                        <div class="card-title">${title}</div>
                    `;
                    const mediaType = item.media_type || 'movie';
                    card.onclick = () => openPlayer(mediaType, item.id, title);
                    resultsContainer.appendChild(card);
                }
            });
        }

        function openPlayer(type, id, title) {
            currentMedia = { type, id, title };
            switchServer(1);
            document.getElementById('playerModal').style.display = 'flex';
        }

        function switchServer(serverNum) {
            let embedUrl = '';
            const encodedTitle = encodeURIComponent(currentMedia.title);
            
            if (serverNum === 1) {
                // HiAnime / AniWave Embed Engine
                embedUrl = `https://2embed.org/embed/anime?id=${currentMedia.id}`;
            } else if (serverNum === 2) {
                // MovieBox / VidSrc Stream Engine
                embedUrl = `https://vidsrc.to/embed/${currentMedia.type}/${currentMedia.id}`;
            } else if (serverNum === 3) {
                // AnimeWorld Backup Engine
                embedUrl = `https://autoembed.to/anime/watch?q=${encodedTitle}`;
            }

            document.getElementById('videoIframe').src = embedUrl;
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });
        loadTrending();
    </script>
</body>
</html>
