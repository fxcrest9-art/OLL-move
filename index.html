<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I-LL-MOVE - Anime World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f12; color: #ffffff; font-family: Arial, sans-serif; }
        
        .navbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: #1a1a24; }
        .logo { color: #e50914; font-size: 22px; font-weight: bold; }
        .search-box { display: flex; gap: 8px; }
        .search-box input { padding: 8px 12px; border-radius: 4px; border: none; outline: none; font-size: 14px; }
        .search-box button { background: #e50914; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        .container { padding: 20px; }
        .section-title { font-size: 18px; margin-bottom: 15px; color: #e50914; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .card { background: #181920; border-radius: 8px; overflow: hidden; text-align: center; border: 1px solid #2a2b36; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-title { font-size: 13px; padding: 10px; font-weight: bold; height: 50px; display: flex; align-items: center; justify-content: center; }
        .loading { text-align: center; font-size: 16px; color: #888; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">I-LL-MOVE</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Anime (e.g. Naruto)">
            <button onclick="searchAnime()">Search</button>
        </div>
    </div>

    <div class="container">
        <div class="section-title" id="heading">Trending Anime</div>
        <div id="results" class="grid"></div>
    </div>

    <script>
        const resultsContainer = document.getElementById('results');
        const heading = document.getElementById('heading');
        const searchInput = document.getElementById('searchInput');

        // Trending Anime Load Karega
        async function loadTrending() {
            resultsContainer.innerHTML = '<div class="loading">Anime load ho raha hai...</div>';
            try {
                const res = await fetch('https://api.jikan.moe/v4/top/anime');
                const data = await res.json();
                renderCards(data.data);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="loading">Error loading anime. Try again!</div>';
            }
        }

        // Anime Search Karega
        async function searchAnime() {
            const query = searchInput.value.trim();
            if (!query) return;

            heading.innerText = `Results for: ${query}`;
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=20`);
                const data = await res.json();
                renderCards(data.data);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="loading">Kuch gadbad hui. Phir se try karein!</div>';
            }
        }

        // Screen par Cards Dikhane ke liye
        function renderCards(items) {
            resultsContainer.innerHTML = '';
            if (!items || items.length === 0) {
                resultsContainer.innerHTML = '<div class="loading">Koi anime nahi mila!</div>';
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.images.jpg.image_url}" alt="${item.title}">
                    <div class="card-title">${item.title}</div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        // Enter key press karne par bhi search ho
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAnime();
            }
        });

        // Page khulte hi top anime dikhayega
        loadTrending();
    </script>

</body>
</html>
