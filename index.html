<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL-MOVE - Movies, Anime & Dramas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #050508; 
            color: #ffffff; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Space Canvas / Starfield Background */
        #space-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
        }

        /* Header / Navbar */
        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 15px 5%; 
            background: rgba(15, 15, 22, 0.75); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo { 
            color: #e50914; 
            font-size: 26px; 
            font-weight: 900; 
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }

        .controls { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            max-width: 600px;
            flex-wrap: wrap;
        }

        .controls input, .controls select { 
            padding: 10px 14px; 
            border-radius: 6px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(10, 10, 15, 0.8); 
            color: #fff; 
            font-size: 14px;
            outline: none;
        }

        .controls input { flex: 2; min-width: 150px; }
        .controls select { flex: 1; min-width: 90px; cursor: pointer; }

        .controls button { 
            background: linear-gradient(45deg, #e50914, #ff3b30); 
            color: #fff; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
            transition: 0.3s;
        }

        .controls button:hover { transform: scale(1.05); }

        /* Main Content Container */
        .container { padding: 30px 5%; }
        
        .section-title { 
            font-size: 22px; 
            margin-bottom: 20px; 
            color: #ffffff; 
            font-weight: 700;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }

        .grid {
