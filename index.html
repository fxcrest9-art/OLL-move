<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL-MOVE - Movies, Anime & Dramas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* YouTube Style Clean Dark Theme */
        body { 
            background: #0f0f0f; 
            color: #f1f1f1; 
            font-family: Roboto, Arial, sans-serif;
        }

        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 12px 4%; 
            background: #212121; 
            position: sticky; top: 0;
            z-index: 100;
            flex-wrap: wrap; gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .logo { 
            color: #ff0000; 
            font-size: 22px; 
            font-weight: bold; 
            letter-spacing: 1px;
        }

        .controls { 
            display: flex; 
            gap: 8px; 
            width: 100%; max-width: 600px;
            flex-wrap: wrap;
        }

        .controls input, .controls select { 
            padding: 8px 12px; 
            border-radius: 18px; 
            border: 1px solid #383838; 
            background: #121212; 
            color: #fff; 
            font-size: 13px;
            outline: none;
        }

        .controls input { flex: 2; min-width: 140px; }
        .controls select { flex: 1; min-width: 80px; }

        .controls button { 
            background: #cc0000; 
            color: #fff; 
            border: none; 
            padding: 8px 18px; 
            border-radius: 18px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .container { padding: 20px 4%; }
        
        .section-title { 
            font-size: 18px; 
            margin-bottom: 15px; 
            color: #ffffff; 
            font-weight: 500;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 16px; 
        }

        .card { 
            background: #181818; 
            border-radius: 8px; 
            overflow: hidden; 
            text-align: center; 
            cursor: pointer; 
            transition: transform 0.2s;
        }

        .card:hover { transform: scale(1.03); }

        .card img { width: 100%; height: 210px; object-fit: cover; }
        
        .card-title { 
            font-size: 12px; 
            padding: 8px; 
            font-weight: 500; 
            height: 45px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #f1f1f1;
        }

        .loading { 
            text-align: center; 
            font-size: 16px; 
            color: #aaa; 
            margin-top: 30px; 
            grid-column: 1 / -1; 
        }

        /* Player Modal */
        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.9); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
            flex-direction: column;
        }

        .modal-content { 
            width: 95%; max-width: 850px; 
            height: 460px; 
            background: #000; 
            position: relative; 
            border-radius: 8px;
            overflow: hidden;
        }

        .close-btn { 
            position: absolute; 
            top: -35px; right: 0; 
            color: #fff; font-size: 28px; 
            cursor: pointer; font-weight: bold; 
        }

        .server-btn-container {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .server-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="logo">ALL-MOVE</div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search Movies, Anime, K-Drama, Dubbed...">
            <select id="typeSelect">
                <option value="all">All Category</option>
                <option value="movie">Movies</option>
                <option value="tv">TV / Anime / Drama</option>
            </select>
            <select id="langSelect">
                <option value="sub">SUB</option>
                <option value="dub">DUB / Hindi</option>
            </select>
            <button onclick="handleSearch()">Search</button>
        </div>
    </div>

    <div class="container">
        <div class="section-title" id="heading">Trending Now</div>
        <div id="results" class="grid"></div>
    </div>

    <!-- Player Window -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
        <div class="server-btn-container">
            <button class="server-btn" onclick="switchServer(1)">Server 1</button>
            <button class="server-btn" onclick="switchServer(2)">Server 2</button>
            <button class="server-btn" onclick="switchServer(3)">Server 3</button>
        </div>
    </div>

    <script>
        const TMDB_KEY = '3fd2be6f0c7aa2598f0022221c565c6f';
        const resultsContainer = document.getElementById('results');
        const heading = document.getElementById('heading');
        const searchInput = document.getElementById('searchInput');

        let currentMedia = { type: '', id: '' };

        async function loadTrending() {
            resultsContainer.innerHTML = '<div class="loading">Loading videos...</div>';
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}`);
                const data = await res.json();
                renderCards(data.results);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="loading">Unable to fetch content.</div>';
            }
        }

        async function handleSearch() {
            let query = searchInput.value.trim();
            const type = document.getElementById('typeSelect').value;
            const lang = document.getElementById('langSelect').value;

            if (!query) return;

            if (lang === 'dub') {
                query += ' Hindi';
            }

            heading.innerText = `Results for: ${searchInput.value.trim()}`;
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            try {
                let url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                if (type !== 'all') {
                    url = `https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                }
                const res = await fetch(url);
                const data = await res.json();
                renderCards(data.results);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="loading">Search error. Try again.</div>';
            }
        }

        function renderCards(items) {
            resultsContainer.innerHTML = '';
            if (!items || items.length === 0) {
                resultsContainer.innerHTML = '<div class="loading">No content found!</div>';
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name;
                const posterPath = item.poster_path;

                if (posterPath && title) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w500${posterPath}" alt="${title}">
                        <div class="card-title">${title}</div>
                    `;
                    
                    const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
                    card.onclick = () => openPlayer(type, item.id);
                    resultsContainer.appendChild(card);
                }
            });
        }

        function openPlayer(type, id) {
            currentMedia = { type, id };
            switchServer(1);
            document.getElementById('playerModal').style.display = 'flex';
        }

        function switchServer(serverNum) {
            const { type, id } = currentMedia;
            let embedUrl = '';
            
            if (serverNum === 1) {
                embedUrl = `https://vidsrc.to/embed/${type}/${id}`;
            } else if (serverNum === 2) {
                embedUrl = `https://vidsrc.me/embed/${type}?tmdb=${id}`;
            } else if (serverNum === 3) {
                embedUrl = `https://multiembed.mov/?video_id=${id}&tmdb=1`;
            }

            document.getElementById('videoIframe').src = embedUrl;
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });
        loadTrending();
    </script>
</body>
</html>
