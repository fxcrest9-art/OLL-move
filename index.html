<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL-MOVE - Movies, Anime & Dramas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: #050508; 
            color: #ffffff; 
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        #space-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(ellipse at bottom, #111a28 0%, #050508 100%);
        }

        .navbar { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 15px 5%; 
            background: rgba(15, 15, 22, 0.85); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0;
            z-index: 100;
            flex-wrap: wrap; gap: 12px;
        }

        .logo { 
            color: #e50914; 
            font-size: 24px; 
            font-weight: 900; 
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(229, 9, 20, 0.6);
        }

        .controls { 
            display: flex; 
            gap: 8px; 
            width: 100%; max-width: 550px;
            flex-wrap: wrap;
        }

        .controls input, .controls select { 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            background: #0d0d14; 
            color: #fff; 
            font-size: 13px;
            outline: none;
        }

        .controls input { flex: 2; min-width: 140px; }
        .controls select { flex: 1; min-width: 80px; cursor: pointer; }

        .controls button { 
            background: #e50914; 
            color: #fff; 
            border: none; 
            padding: 10px 18px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }

        .container { padding: 25px 5%; }
        
        .section-title { 
            font-size: 20px; 
            margin-bottom: 20px; 
            color: #ffffff; 
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 18px; 
        }

        .card { 
            background: rgba(24, 25, 32, 0.8); 
            border-radius: 8px; 
            overflow: hidden; 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            cursor: pointer; 
            transition: 0.3s;
        }

        .card:hover { 
            transform: translateY(-5px); 
            border-color: #e50914;
        }

        .card img { width: 100%; height: 210px; object-fit: cover; }
        
        .card-title { 
            font-size: 12px; 
            padding: 8px; 
            font-weight: 600; 
            height: 45px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }

        .loading { 
            text-align: center; 
            font-size: 16px; 
            color: #aaa; 
            margin-top: 30px; 
            grid-column: 1 / -1; 
        }

        .modal { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.95); 
            z-index: 1000; 
            justify-content: center; 
            align-items: center; 
        }

        .modal-content { 
            width: 95%; max-width: 850px; 
            height: 480px; 
            background: #000; 
            position: relative; 
            border-radius: 8px;
            overflow: hidden;
        }

        .close-btn { 
            position: absolute; 
            top: 5px; right: 15px; 
            color: #fff; font-size: 30px; 
            cursor: pointer; font-weight: bold; 
            z-index: 1001;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <canvas id="space-bg"></canvas>

    <div class="navbar">
        <div class="logo">ALL-MOVE</div>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search Movies, Anime, K-Drama...">
            <select id="typeSelect">
                <option value="all">All Content</option>
                <option value="movie">Movies</option>
                <option value="tv">TV / Anime / Drama</option>
            </select>
            <select id="langSelect">
                <option value="sub">SUB</option>
                <option value="dub">DUB / Hindi</option>
            </select>
            <button onclick="handleSearch()">Search</button>
        </div>
    </div>

    <div class="container">
        <div class="section-title" id="heading">Trending Content</div>
        <div id="results" class="grid"></div>
    </div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closePlayer()">&times;</span>
            <iframe id="videoIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Canvas Stars Animation
        const canvas = document.getElementById('space-bg');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 1.3,
                    speed: Math.random() * 0.4 + 0.1
                });
            }
        }

        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fill();
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(animateStars);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        animateStars();

        const TMDB_KEY = '3fd2be6f0c7aa2598f0022221c565c6f';
        const resultsContainer = document.getElementById('results');
        const heading = document.getElementById('heading');
        const searchInput = document.getElementById('searchInput');

        async function loadTrending() {
            resultsContainer.innerHTML = '<div class="loading">Loading movies & shows...</div>';
            try {
                const res = await fetch(`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_KEY}`);
                const data = await res.json();
                renderCards(data.results);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="loading">Unable to fetch content.</div>';
            }
        }

        async function handleSearch() {
            let query = searchInput.value.trim();
            const type = document.getElementById('typeSelect').value;
            const lang = document.getElementById('langSelect').value;

            if (!query) return;

            if (lang === 'dub') {
                query += ' Hindi';
            }

            heading.innerText = `Results for: ${searchInput.value.trim()}`;
            resultsContainer.innerHTML = '<div class="loading">Searching...</div>';

            try {
                let url = `https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                if (type !== 'all') {
                    url = `https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}`;
                }
                const res = await fetch(url);
                const data = await res.json();
                renderCards(data.results);
            } catch (error) {
                resultsContainer.innerHTML = '<div class="loading">Search error. Please try again.</div>';
            }
        }

        function renderCards(items) {
            resultsContainer.innerHTML = '';
            if (!items || items.length === 0) {
                resultsContainer.innerHTML = '<div class="loading">No content found!</div>';
                return;
            }

            items.forEach(item => {
                const title = item.title || item.name;
                const posterPath = item.poster_path;

                if (posterPath && title) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w500${posterPath}" alt="${title}">
                        <div class="card-title">${title}</div>
                    `;
                    
                    const type = item.media_type || (item.first_air_date ? 'tv' : 'movie');
                    card.onclick = () => openPlayer(type, item.id);
                    resultsContainer.appendChild(card);
                }
            });
        }

        function openPlayer(type, id) {
            const embedUrl = `https://vidsrc.to/embed/${type}/${id}`;
            document.getElementById('videoIframe').src = embedUrl;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('videoIframe').src = '';
            document.getElementById('playerModal').style.display = 'none';
        }

        searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSearch(); });
        loadTrending();
    </script>
</body>
</html>
