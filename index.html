<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-LL-MOVE - All Movies & Anime</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #141414; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; }
    
    .navbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 4%; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); position: fixed; top: 0; width: 100%; z-index: 100; }
    .logo { color: #e50914; font-size: 24px; font-weight: 900; letter-spacing: 1px; text-decoration: none; }
    .nav-links { display: flex; gap: 15px; list-style: none; font-size: 14px; }
    .nav-links a { color: #e5e5e5; text-decoration: none; }

    .hero { height: 60vh; background: linear-gradient(to top, #141414, transparent), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=1000') center/cover no-repeat; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px 4%; margin-bottom: 20px; }
    .hero h1 { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
    .hero p { font-size: 14px; color: #aaa; max-width: 500px; margin-bottom: 15px; line-height: 1.4; }
    .hero-btn { background-color: #e50914; color: white; border: none; padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: fit-content; }

    .section { padding: 0 4% 30px; }
    .section-title { font-size: 18px; margin-bottom: 12px; font-weight: 600; }
    .movie-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .movie-row::-webkit-scrollbar { display: none; }
    
    .card { flex: 0 0 130px; background: #222; border-radius: 4px; overflow: hidden; transition: transform 0.2s; cursor: pointer; }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .card-title { font-size: 12px; padding: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="navbar">
    <a href="#" class="logo">I-LL-MOVE</a>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Movies</a></li>
      <li><a href="#">Anime</a></li>
    </ul>
  </div>

  <div class="hero">
    <h1>All Movies & Anime</h1>
    <p>Watch trending movies and anime shows. Mobile responsive UI setup testing.</p>
    <button class="hero-btn">▶ Play Now</button>
  </div>

  <div class="section">
    <h2 class="section-title">Trending Now</h2>
    <div class="movie-row">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=300" alt="Movie">
        <div class="card-title">Sample Movie 1</div>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1518676599625-583566160350?q=80&w=300" alt="Movie">
        <div class="card-title">Sample Movie 2</div>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=300" alt="Movie">
        <div class="card-title">Sample Movie 3</div>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1535016120720-40c646be5580?q=80&w=300" alt="Movie">
        <div class="card-title">Sample Movie 4</div>
      </div>
    </div>
  </div>

</body>
</html>
